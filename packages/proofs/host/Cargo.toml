[package]
name = "swaraj-gate-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sp1-sdk = { version = "=6.9.0", features = ["blocking"] }
bincode = { version = "2", features = ["serde"] }
serde = "1"
serde_json = "1"

[features]
# Groth16 without Docker; needs Go and roughly 16 GB of free memory.
native-gnark = ["sp1-sdk/native-gnark"]
